<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FrameVault</title>
    <style>
      body, html { margin: 0; padding: 0; background-color: #0A0A0B; width: 100%; height: 100%; }
      #root { width: 100%; min-height: 100%; display: flex; flex-direction: column; }
      @keyframes spin { 100% { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="root">
      <div style="position: fixed; top: 0; left: 0; right: 0; bottom: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background-color: #0A0A0B;">
        <div style="width: 38px; height: 38px; border: 3px solid #232327; border-top-color: #F5822E; border-radius: 50%; animation: spin 0.9s linear infinite; margin-bottom: 16px;"></div>
        <div style="font-size: 13px; font-weight: 500; color: #8A8A93; font-family: 'Segoe UI', sans-serif;">Starting up...</div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
